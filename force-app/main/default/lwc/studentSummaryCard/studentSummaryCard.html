<template>
    <div class="student-wrapper">

        <div class="student-header">
            <img src={rgpvCampusUrl} class="header-campus" alt="Campus background">

            <div class="header-left">
                <div class="avatar">
                    <img src={studentAvatarUrl} alt={studentName} class="avatar-image">
                </div>

                <div class="student-identity">
                    <h1 class="student-name" title={studentName}>
                        {studentName}
                    </h1>

                    <span class="student-id">
                        Student ID: {studentCode}
                    </span>

                    <div class={statusPillClass}>
                        <span class={statusDotClass}></span>
                        <span>{enrolmentStatus}</span>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="brand-block">
                    <img src={rgpvLogoUrl} class="brand-crest" alt="RGPV crest">
                    <div class="brand-text">
                        <span class="brand-line">RAJIV GANDHI PROUDYOGIKI</span>
                        <span class="brand-line">VISHWAVIDYALAYA, BHOPAL</span>
                        <span class="brand-tagline">Excellence in Technical Education</span>
                    </div>
                </div>

                <button
                    class="refresh-btn"
                    onclick={handleRefresh}
                    title="Refresh Student Data">

                    <lightning-icon
                        icon-name="utility:refresh"
                        size="small"
                        class="refresh-icon">
                    </lightning-icon>
                </button>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="loading-container">
                <lightning-spinner
                    alternative-text="Loading student data"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={errorMessage}>
            <div class="error-container">
                <lightning-icon
                    icon-name="utility:error"
                    size="x-small"
                    variant="inverse">
                </lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:else>

            <section class="section academic-section">

                <div class="section-heading">
                    <div class="section-icon orange-icon">
                        <lightning-icon
                            icon-name="utility:education"
                            size="small"
                            class="white-icon">
                        </lightning-icon>
                    </div>

                    <div class="section-title-area">
                        <h2>Academic Performance</h2>
                        <span>Student academic snapshot</span>
                    </div>

                    <div class="rgpv-brand">
                        <img src={rgpvAcadWatermarkUrl} alt="RGPV crest" class="brand-watermark-img">
                    </div>
                </div>

                <div class="academic-grid">

                    <div class="metric-card metric-orange">
                        <div class="metric-top">
                            <div class="metric-icon icon-orange">
                                <lightning-icon
                                    icon-name="utility:award"
                                    size="small"
                                    class="white-icon">
                                </lightning-icon>
                            </div>

                            <div class="metric-ghost" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="3" y="13" width="4" height="8" rx="1.4"></rect>
                                    <rect x="10" y="8" width="4" height="13" rx="1.4"></rect>
                                    <rect x="17" y="3" width="4" height="18" rx="1.4"></rect>
                                </svg>
                            </div>
                        </div>

                        <span class="metric-label">GPA</span>
                        <div class="metric-value">
                            {formattedGpa}
                            <small>/ 4.00</small>
                        </div>

                        <div class="metric-track">
                            <div class={gpaBarClass}></div>
                        </div>
                    </div>

                    <div class="metric-card metric-green">
                        <div class="metric-top">
                            <div class="metric-icon icon-green">
                                <lightning-icon
                                    icon-name="utility:check"
                                    size="small"
                                    class="white-icon">
                                </lightning-icon>
                            </div>

                            <div class="metric-ghost" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3,17 9,11 13,14 21,5"></polyline>
                                    <polyline points="16,5 21,5 21,10"></polyline>
                                </svg>
                            </div>
                        </div>

                        <span class="metric-label">Attendance</span>
                        <div class="metric-value">
                            {formattedAttendance}%
                        </div>

                        <div class="metric-track">
                            <div class={attendanceBarClass}></div>
                        </div>
                    </div>

                    <div class={feeTileClass}>
                        <div class="metric-top">
                            <div class={feeSquircleClass}>
                                <lightning-icon
                                    icon-name="utility:money"
                                    size="small"
                                    class="white-icon">
                                </lightning-icon>
                            </div>

                            <div class="metric-ghost" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="3" y="5" width="18" height="3.2" rx="1.6"></rect>
                                    <rect x="3" y="10.4" width="13" height="3.2" rx="1.6"></rect>
                                    <rect x="3" y="15.8" width="8" height="3.2" rx="1.6"></rect>
                                </svg>
                            </div>
                        </div>

                        <span class="metric-label">Fee Status</span>
                        <div class={feeValTextClass}>
                            {feeStatus}
                        </div>
                    </div>

                    <div class="metric-card metric-blue">
                        <div class="metric-top">
                            <div class="metric-icon icon-blue">
                                <lightning-icon
                                    icon-name="utility:notebook"
                                    size="small"
                                    class="white-icon">
                                </lightning-icon>
                            </div>

                            <div class="metric-ghost" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="12,3 22,8 12,13 2,8"></polygon>
                                    <polygon points="12,12 22,17 12,22 2,17" opacity="0.55"></polygon>
                                </svg>
                            </div>
                        </div>

                        <span class="metric-label">Courses</span>
                        <div class="metric-value">
                            {registeredCourseCount}
                            <small>Active</small>
                        </div>

                        <div class="metric-track">
                            <div class={courseBarClass}></div>
                        </div>
                    </div>

                </div>
            </section>

            <section class="section institutional-section">

                <div class="section-heading">
                    <div class="section-icon purple-icon">
                        <lightning-icon
                            icon-name="utility:company"
                            size="small"
                            class="white-icon">
                        </lightning-icon>
                    </div>

                    <div class="section-title-area">
                        <h2>Enrollment & Institutional Details</h2>
                        <span>Program and academic information</span>
                    </div>

                    <div class="rgpv-brand">
                        <img src={rgpvInstWatermarkUrl} alt="RGPV crest" class="brand-watermark-img">
                    </div>
                </div>

                <div class="details-grid">

                    <div class="detail-card detail-card-3col tint-orange">
                        <div class="detail-icon">
                            <lightning-icon
                                icon-name="utility:standard_objects"
                                size="small">
                            </lightning-icon>
                        </div>

                        <div class="detail-content">
                            <span class="detail-label">Program</span>

                            <template lwc:if={programId}>
                                <a
                                    href={programUrl}
                                    class="detail-value link value-program"
                                    title={programName}>
                                    {programName}
                                </a>
                            </template>

                            <template lwc:else>
                                <span
                                    class="detail-value value-program"
                                    title={programName}>
                                    {programName}
                                </span>
                            </template>
                        </div>

                        <lightning-icon
                            icon-name="utility:education"
                            size="small"
                            class="detail-ghost">
                        </lightning-icon>
                    </div>

                    <div class="detail-card detail-card-3col tint-blue">
                        <div class="detail-icon">
                            <lightning-icon
                                icon-name="utility:work_order_type"
                                size="small">
                            </lightning-icon>
                        </div>

                        <div class="detail-content">
                            <span class="detail-label">Department</span>
                            <span
                                class="detail-value"
                                title={department}>
                                {department}
                            </span>
                        </div>

                        <lightning-icon
                            icon-name="utility:company"
                            size="small"
                            class="detail-ghost">
                        </lightning-icon>
                    </div>

                    <div class="detail-card detail-card-3col tint-amber">
                        <div class="detail-icon">
                            <lightning-icon
                                icon-name="utility:event"
                                size="small">
                            </lightning-icon>
                        </div>

                        <div class="detail-content">
                            <span class="detail-label">Current Semester</span>
                            <span class="detail-value">
                                {semester}
                            </span>
                        </div>

                        <lightning-icon
                            icon-name="utility:notebook"
                            size="small"
                            class="detail-ghost">
                        </lightning-icon>
                    </div>

                    <div class="detail-card detail-card-2col tint-purple">
                        <div class="detail-icon">
                            <lightning-icon
                                icon-name="utility:user"
                                size="small">
                            </lightning-icon>
                        </div>

                        <div class="detail-content">
                            <span class="detail-label">Faculty Advisor</span>

                            <template lwc:if={facultyAdvisorId}>
                                <a
                                    href={facultyAdvisorUrl}
                                    class="detail-value link value-advisor"
                                    title={facultyAdvisorName}>
                                    {facultyAdvisorName}
                                </a>
                            </template>

                            <template lwc:else>
                                <span
                                    class="detail-value value-advisor"
                                    title={facultyAdvisorName}>
                                    {facultyAdvisorName}
                                </span>
                            </template>
                        </div>

                        <lightning-icon
                            icon-name="utility:user_group"
                            size="small"
                            class="detail-ghost">
                        </lightning-icon>
                    </div>

                    <div class="detail-card detail-card-2col tint-green">
                        <div class="detail-icon">
                            <lightning-icon
                                icon-name="utility:date_time"
                                size="small">
                            </lightning-icon>
                        </div>

                        <div class="detail-content">
                            <span class="detail-label">Admission Date</span>

                            <template lwc:if={admissionDate}>
                                <lightning-formatted-date-time
                                    value={admissionDate}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    class="detail-value">
                                </lightning-formatted-date-time>
                            </template>

                            <template lwc:else>
                                <span class="detail-value">
                                    Not Set
                                </span>
                            </template>
                        </div>

                        <lightning-icon
                            icon-name="utility:event"
                            size="small"
                            class="detail-ghost">
                        </lightning-icon>
                    </div>

                </div>
            </section>

        </template>
    </div>
</template>
